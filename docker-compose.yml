services:
  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rackup config.ru -o 0.0.0.0 -p 4666"
    volumes:
      - .:/app
      # libpq reads this only when DATABASE_URL has no password; /dev/null keeps it a file where PGPASS_FILE isn't set.
      - ${PGPASS_FILE:-/dev/null}:/run/secrets/pgpass:ro
    restart: unless-stopped
    ports:
      - "127.0.0.1:4666:4666"
    env_file:
      - .env
    environment:
      - RACK_ENV=${RACK_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - PGPASSFILE=/run/secrets/pgpass
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-mmdb.online}
      - TMDB_TOKEN=${TMDB_TOKEN}
      - TAUTULLI_KEY=${TAUTULLI_KEY}
      - PLEX_USER=${PLEX_USER}
      - PLEX_USER_ID=${PLEX_USER_ID}
      - LIBRARY_KEY=${LIBRARY_KEY:-1}
      - REDISTOGO_URL=${REDISTOGO_URL:-redis://localhost:6379/}
