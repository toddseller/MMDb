name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The master ruleset requires a check named "test"; renaming this job silently drops the requirement.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches production, so db/structure.sql loads exactly as it does there.
        image: postgres:11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # spec_helper forces a URL without credentials, so pg and psql take them from these.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      # .ruby-version is gitignored, so the version is stated here.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      # deploy.yml only runs on a tag, so this is where a broken workflow gets caught.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -no-color

      - run: createdb MMDb_test

      - run: bundle exec rspec

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/

      # Browser tests: Playwright drives Chromium against the app, which runs on its own database (see e2e/).
      # They stay in this job so the required "test" check covers them.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Type checks and unit tests are quick, so they run before the Chromium download the browser tests need.
      - run: npm run typecheck

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: createdb MMDb_e2e

      - run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
